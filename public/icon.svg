<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Outer glowing border -->
  <rect x="16" y="16" width="480" height="480" rx="99" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.6" />

  <!-- Shield Shape for Security / Keamanan -->
  <path d="M 256 80 L 370 135 C 370 260 256 345 256 345 C 256 345 142 260 142 135 Z" fill="url(#shieldGrad)" filter="url(#shadow)" opacity="0.9" />

  <!-- House roof inside shield (Community / Warga) -->
  <path d="M 256 145 L 330 205 L 305 205 L 305 280 L 207 280 L 207 205 L 182 205 Z" fill="#ffffff" />
  
  <!-- Modern Door / Gateway -->
  <rect x="238" y="225" width="36" height="55" rx="6" fill="#047857" />
  <!-- Chimney -->
  <rect x="290" y="155" width="16" height="28" rx="2" fill="#ffffff" opacity="0.9" />

  <!-- Radio wave / Gateway Wifi indicator -->
  <path d="M 220 120 A 45 45 0 0 1 292 120" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <path d="M 235 132 A 25 25 0 0 1 277 132" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" />

  <!-- Badges / Pill at Bottom -->
  <rect x="80" y="375" width="352" height="65" rx="32" fill="#1e293b" stroke="#10b981" stroke-width="3" filter="url(#shadow)" />
  
  <!-- Typography inside badge -->
  <text x="256" y="418" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    NEO <tspan fill="#10b981">PoRT3</tspan>
  </text>
  
  <!-- Subtitle pill text -->
  <text x="256" y="468" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
    RT.03 RW.14 BPTW CILACAP
  </text>
</svg>
